name: Update Google Reviews

# Met a jour data/google-reviews.json avec la note et le nombre d'avis
# Google reels, via l'API Google Places (New) - Place Details.
#
# Pour activer cette automatisation :
#   1. Dans Google Cloud Console, activer l'API "Places API (New)" sur
#      un projet, puis creer une cle API restreinte a cette seule API.
#   2. Recuperer le Place ID de la fiche Google Business Profile
#      (https://developers.google.com/maps/documentation/places/web-service/place-id).
#   3. Dans GitHub : Settings > Secrets and variables > Actions, ajouter :
#        - GOOGLE_PLACES_API_KEY
#        - GOOGLE_PLACE_ID
# Tant que ces secrets ne sont pas definis, ce workflow ne fait rien
# (il se termine proprement sans erreur ni modification, et le badge du
# site conserve son etat neutre "Avis Google / Voir nos avis").

on:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi a 06h00 UTC (1x/semaine)
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer la note depuis Places API (New)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: |
          set -e

          if [ -z "$GOOGLE_PLACES_API_KEY" ] || [ -z "$GOOGLE_PLACE_ID" ]; then
            echo "Secrets GOOGLE_PLACES_API_KEY / GOOGLE_PLACE_ID absents : etape ignoree, rien a mettre a jour."
            exit 0
          fi

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -H "X-Goog-Api-Key: ${GOOGLE_PLACES_API_KEY}" \
            -H "X-Goog-FieldMask: rating,userRatingCount,googleMapsUri" \
            "https://places.googleapis.com/v1/places/${GOOGLE_PLACE_ID}")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Reponse API invalide (HTTP $HTTP_STATUS) : fichier non modifie."
            cat response.json
            exit 0
          fi

          RATING=$(jq -r '.rating // empty' response.json)
          COUNT=$(jq -r '.userRatingCount // empty' response.json)

          if [ -z "$RATING" ] || [ -z "$COUNT" ]; then
            echo "Champs rating/userRatingCount absents de la reponse : fichier non modifie."
            cat response.json
            exit 0
          fi

          jq --arg fallback_url "https://www.google.com/search?q=Hu%C3%AEtres+et+Coquillages+Le+Guennec+Crac%27h+avis" \
             --arg updated "$(date -u +%Y-%m-%d)" \
             '{
               rating: .rating,
               reviews: .userRatingCount,
               url: (.googleMapsUri // $fallback_url),
               updated: $updated
             }' response.json > data/google-reviews.json

          rm -f response.json

      - name: Committer si le fichier a change
        run: |
          if git diff --quiet -- data/google-reviews.json; then
            echo "Aucun changement de note/avis."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/google-reviews.json
          git commit -m "chore: mise a jour automatique de la note Google"
          git push
